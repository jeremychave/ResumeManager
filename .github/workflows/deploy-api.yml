      - name: Get AAD token
        id: aad-token
        run: |
          TOKEN=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Export SQL access token
        run: |
          echo "SQL_ACCESS_TOKEN=${{ steps.aad-token.outputs.token }}" >> $GITHUB_ENV
      
      - name: Dump token claims
        run: |
          TOKENN=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)
          echo $TOKENN | jq -R 'split(".") | .[1] | @base64d | fromjson'

      - name: Apply EF Core migrations
        env:
          SQL_ACCESS_TOKEN: ${{ steps.aad-token.outputs.token }}
          ConnectionStrings__ResumeManagerDb: "Server=tcp:resumemanager-sql.database.windows.net,1433;Initial Catalog=resumemanagerdb;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
        run: |
          cd ResumeManagerWebApi
          dotnet ef database update

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-api
      
      - name: Login to Azure with infra-service-principal
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_INFRA_SERVICE_PRINCIPAL_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get identity-GitHubAction clientId
        id: get-identity-clientId-deploy
        run: |
          CLIENT_ID=$(az identity show \
            --name resumemanager-GitHubAction \
            --resource-group ${{ github.event.inputs.resourceGroupName }} \
            --query "clientId" -o tsv)

          echo "clientId=$CLIENT_ID" >> $GITHUB_OUTPUT
      
      - name: Login to Azure with api-identity
        uses: azure/login@v2
        with:
          client-id: ${{ steps.get-identity-clientId-deploy.outputs.clientId }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'resumemanager-api'
          ResourceGroupName: ${{ github.event.inputs.resourceGroupName }}
          slot-name: 'Production'
          package: .
          