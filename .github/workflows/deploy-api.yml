name: Deploy API

on:
  workflow_dispatch:
    inputs:
      resourceGroupName:
        description: "Name of the ressource group of the API webapp"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build ./ResumeManagerWebApi/ResumeManagerWebApi.sln --configuration Release
      
      - name: Test
        run: dotnet test ./ResumeManagerWebApi/ResumeManagerWebApi.sln --configuration Release --no-build

      - name: Publish
        run: dotnet publish ./ResumeManagerWebApi/ResumeManagerWebApi.sln -c Release -o "${{env.DOTNET_ROOT}}/myapi"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-api
          path: ${{env.DOTNET_ROOT}}/myapi

  updateDatabase:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef

      - name: Restore
        run: dotnet restore ./ResumeManagerWebApi/ResumeManagerWebApi.sln
      
      - name: Login to Azure with infra-service-principal
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_INFRA_SERVICE_PRINCIPAL_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Get identity-GitHubAction clientId
        id: get-identity-clientId-updateDatabase
        run: |
          CLIENT_ID=$(az identity show \
            --name resumemanager-GitHubAction \
            --resource-group ${{ github.event.inputs.resourceGroupName }} \
            --query "clientId" -o tsv)

          echo "clientId=$CLIENT_ID" >> $GITHUB_OUTPUT

      - name: Login to Azure with api-identity
        uses: azure/login@v2
        with:
          client-id: ${{ steps.get-identity-clientId-updateDatabase.outputs.clientId }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

