# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: ResumeManagerAngular WebApp

on:
  push:
    branches:
      - main
    paths: 
      - 'ResumeManagerWebAppAngular/**'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_RESUMEMANAGER_GITHUBACTIONS }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_RESUMEMANAGER_GITHUBACTIONS }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_103DE73A1D674EFB92B9CF94A1848FEF }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build -f ./ResumeManagerWebAppAngular/prod.dockerfile -t ${{ secrets.ACR_LOGIN_SERVER }}/resumemanagerwebappangular:latest ./ResumeManagerWebAppAngular

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/resumemanagerwebappangular:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_RESUMEMANAGER_GITHUBACTIONS }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_RESUMEMANAGER_GITHUBACTIONS }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_103DE73A1D674EFB92B9CF94A1848FEF }}

      - name: Deploy container to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ResumeManagerAngular'
          images: '${{ secrets.ACR_LOGIN_SERVER }}/resumemanagerwebappangular:latest'

          


