name: Deploy Infrastructure 2

on:
  workflow_dispatch:
    inputs:
      resourceGroupName:
        description: "Name of the resource group to be created"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest

    outputs:
      sql_server_name: ${{ steps.get-deployment-outputs.outputs.SQL_SERVER_NAME }}
      sql_database_name: ${{ steps.get-deployment-outputs.outputs.SQL_DATABASE_NAME }}
      identity_name: ${{ steps.get-deployment-outputs.outputs.IDENTITY_NAME }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_INFRA_SERVICE_PRINCIPAL_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy Bicep Infrastructure
      run: |
        az deployment sub create \
          --location canadacentral \
          --template-file infra/main.bicep \
          --parameters resourceGroupName=${{ github.event.inputs.resourceGroupName }}

    - name: Get deployment outputs
      id: get-deployment-outputs
      run: |
        DEPLOYMENT_NAME=$(az deployment sub list --query "[0].name" -o tsv)

        az deployment sub show \
          --name $DEPLOYMENT_NAME \
          --query "properties.outputs" -o json > outputs.json

        echo "SQL_SERVER_NAME=$(jq -r '.sqlServerName.value' outputs.json)" >> $GITHUB_OUTPUT
        echo "SQL_DATABASE_NAME=$(jq -r '.sqlDatabaseName.value' outputs.json)" >> $GITHUB_OUTPUT
        echo "IDENTITY_NAME=$(jq -r '.identityName.value' outputs.json)" >> $GITHUB_OUTPUT

  create-sql-user:
    runs-on: ubuntu-latest
    needs: deploy-infra

    steps:
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_INFRA_SERVICE_PRINCIPAL_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        enable-AzPSSession: true

    - name: Install sqlcmd (Go)
      run: |
        curl -L -o sqlcmd.tar.gz https://github.com/microsoft/go-sqlcmd/releases/latest/download/sqlcmd-linux-amd64.tar.gz
        tar -xzf sqlcmd.tar.gz
        sudo mv sqlcmd /usr/local/bin/
        sudo chmod +x /usr/local/bin/sqlcmd

    - name: Check sqlcmd version
      run: sqlcmd --version

    # - name: Install SqlServer module
    #   shell: powershell
    #   run: Install-Module SqlServer -Force -Scope CurrentUser

    - name: Create AAD SQL User
      run: |
        server="${{ needs.deploy-infra.outputs.sql_server_name }}"
        database="${{ needs.deploy-infra.outputs.sql_database_name }}"
        identityName="${{ needs.deploy-infra.outputs.identity_name }}"

        echo "Getting AAD token..."
        token=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)

        echo "Executing SQL..."
        sql="
        IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '$identityName')
        BEGIN
            CREATE USER [$identityName] FROM EXTERNAL PROVIDER;
        END;

        ALTER ROLE db_datareader ADD MEMBER [$identityName];
        ALTER ROLE db_datawriter ADD MEMBER [$identityName];
        ALTER ROLE db_ddladmin ADD MEMBER [$identityName];
        "

        sqlcmd -S "$server.database.windows.net" -d "$database" -G -C -Q "$sql"