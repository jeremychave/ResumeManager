name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      resourceGroupName:
        description: "Name of the ressource group to be created"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_INFRA_IDENTITY_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy Bicep Infrastructure
      run: |
        az deployment sub create \
          --location canadacentral \
          --template-file infra/main.bicep \
          --parameters resourceGroupName=${{ github.event.inputs.resourceGroupName }}

    - name: Get deployment outputs
      id: outputs
      run: |
        DEPLOYMENT_NAME=$(az deployment sub list --query "[0].name" -o tsv)

        az deployment sub show \
          --name $DEPLOYMENT_NAME \
          --query "properties.outputs" -o json > outputs.json

        echo "SQL_SERVER_NAME=$(jq -r '.sqlServerName.value' outputs.json)" >> $GITHUB_ENV
        echo "SQL_DATABASE_NAME=$(jq -r '.sqlDatabaseName.value' outputs.json)" >> $GITHUB_ENV
        echo "IDENTITY_NAME=$(jq -r '.identityName.value' outputs.json)" >> $GITHUB_ENV

    
    - name: Install SqlServer PowerShell module
      run: |
        pwsh -Command "Install-Module SqlServer -Force -Scope CurrentUser"

    - name: Create AAD SQL User
      run: |
        pwsh -Command "
          $server = ${{ env.SQL_SERVER_NAME }}
          $database = ${{ env.SQL_DATABASE_NAME }}
          $identityName = ${{ env.IDENTITY_NAME }}

          Write-Host 'Getting AAD token...'
          $token = (Get-AzAccessToken -ResourceUrl 'https://database.windows.net').Token

          Write-Host 'Executing SQL...'
          $sql = \"
            IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '$identityName')
            BEGIN
                CREATE USER [$identityName] FROM EXTERNAL PROVIDER;
            END;
            
            ALTER ROLE db_datareader ADD MEMBER [$identityName];
            ALTER ROLE db_datawriter ADD MEMBER [$identityName];
            ALTER ROLE db_ddladmin ADD MEMBER [$identityName];
          \"

          Invoke-Sqlcmd `
            -ServerInstance \"$server.database.windows.net\" `
            -Database \"$database\" `
            -AccessToken $token `
            -Query $sql
        "
