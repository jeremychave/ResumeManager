name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      resourceGroupName:
        description: "Name of the ressource group to be created"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_INFRA_IDENTITY_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy Bicep Infrastructure
      run: |
        az deployment sub create \
          --location canadacentral \
          --template-file infra/main.bicep \
          --parameters resourceGroupName=${{ github.event.inputs.resourceGroupName }}

    - name: Get deployment outputs
      id: outputs
      run: |
        DEPLOYMENT_NAME=$(az deployment sub list --query "[0].name" -o tsv)

        az deployment sub show \
          --name $DEPLOYMENT_NAME \
          --query "properties.outputs" -o json > outputs.json

        echo "SQL_SERVER_NAME=$(jq -r '.sqlServerName.value' outputs.json)" >> $GITHUB_ENV
        echo "SQL_DATABASE_NAME=$(jq -r '.sqlDatabaseName.value' outputs.json)" >> $GITHUB_ENV
        echo "IDENTITY_NAME=$(jq -r '.identityName.value' outputs.json)" >> $GITHUB_ENV

    - name: Install sqlcmd
      run: |
        sudo apt-get update
        sudo apt-get install -y mssql-tools unixodbc-dev
        echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bashrc
        source ~/.bashrc


    - name: Create AAD SQL User
      shell: bash
      run: |
        # Token AAD
        TOKEN=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)

        /opt/mssql-tools/bin/sqlcmd \
          -S "${SQL_SERVER_NAME}.database.windows.net" \
          -d "${SQL_DATABASE_NAME}" \
          -G \
          -U "ActiveDirectoryInteractive" \
          -P "$TOKEN" \
          -Q "
            IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '${IDENTITY_NAME}')
            BEGIN
                CREATE USER [${IDENTITY_NAME}] FROM EXTERNAL PROVIDER;
            END;

            ALTER ROLE db_datareader ADD MEMBER [${IDENTITY_NAME}];
            ALTER ROLE db_datawriter ADD MEMBER [${IDENTITY_NAME}];
            ALTER ROLE db_ddladmin ADD MEMBER [${IDENTITY_NAME}];
          "

