# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - ResumeManagerWebApp/**

pool:
  vmImage: 'windows-latest'

stages:
- stage: Build
  jobs:
  - job: Build
    steps:
    - checkout: self

    - task: UseDotNet@2
      inputs:
        version: '10.0.x'

    - script: dotnet build ResumeManagerWebApp/ResumeManagerWebApp.slnx --configuration Release
      displayName: Build

    - script: dotnet publish ResumeManagerWebApp/ResumeManagerWebApp.slnx -c Release -o $(Build.ArtifactStagingDirectory)
      displayName: Publish

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'webapp'

- stage: Deploy
  dependsOn: Build
  jobs:
  - deployment: DeployWebApp
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: 'webapp'

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'Azure-ResumeManager'
              appType: 'webApp'
              appName: 'ResumeManager'
              package: '$(Pipeline.Workspace)/webapp'

